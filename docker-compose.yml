services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      secrets:
        - hf_token
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    volumes:
      - upload_storage:${UPLOAD_STORAGE_PATH}
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    build:
      context: ./backend
      secrets:
        - hf_token
    command: python -m app.worker.runner
    env_file: .env
    volumes:
      - upload_storage:${UPLOAD_STORAGE_PATH}
      - whisper_models:${WHISPER_MODEL_CACHE}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "3002:80"
    volumes:
      - ./nginx:/etc/nginx/templates
    environment:
      INTERSCRIBE_API_KEY: ${INTERSCRIBE_API_KEY}
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  upload_storage:
  whisper_models:
  ollama_models:

secrets:
  hf_token:
    environment: HF_TOKEN
